[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-mlp-numpy"
version = "0.1.0"
description = "A NumPy-only MNIST MLP with explicit backpropagation and reproducible experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MLP-from-Scratch contributors"}]
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.urls]
Repository = "https://github.com/jp-tedesco/MLP-from-Scratch"
Issues = "https://github.com/jp-tedesco/MLP-from-Scratch/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mnist_mlp*"]
